    user_input: "السلام عليكم ورحمة الله وبركاته. نحن في شركة سماء الخليج للتجارة الإلكترونية بالرياض، ونرغب في استكشاف باقات الاستضافة السحابية المؤسسية وحلول الذكاء الاصطناعي. أنا المهندس خالد بن راشد، وبريدي k.rashid@sama-gulf.sa وهاتفي 0504443322. نرجو تسجيل بياناتنا وتحديد موعد لعرض تقني تجريبي."
